<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Livro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="pagina-formulario">

        <div class="cabecalho-formulario">

            <a href="{{ url_for('livro') }}" class="botao-voltar">Voltar</a>

            <h2>Cadastrar Livro</h2>

            <p>Preencha as informações do novo livro.</p>

        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                <div class="flash-messages">

                    {% for category, message in messages %}

                        <div class="flash {{ category }}">{{ message }}</div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form action="{{ url_for('criar') }}" method="POST" enctype="multipart/form-data" class="form-livro">

            <label for="imagem">Capa do Livro</label>
            <input type="file" id="imagem" name="imagem" accept=".jpg" required>

            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" placeholder="Digite o nome do livro" required>

            <label for="autor">Autor</label>
            <input type="text" id="autor" name="autor" placeholder="Digite o autor do livro" required>

            <label for="data_publicacao">Data de publicação</label>
            <input type="number" id="data_publicacao" name="data_publicacao" placeholder="Digite o ano de publicação" required>

            <button type="submit">Adicionar Livro</button>

        </form>

    </main>

</body>

</html>
