<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Usuário</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="pagina-formulario">

        <div class="cabecalho-formulario">

            <a href="{{ url_for('usuario') }}" class="botao-voltar">Voltar</a>

            <h2>Cadastrar Usuário</h2>

            <p>Preencha as informações do novo usuário.</p>

        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                <div class="flash-messages">

                    {% for category, message in messages %}

                        <div class="flash {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form action="{{ url_for('novo_usuario') }}" method="post">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do usuário" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite o email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="8" placeholder="Digite uma senha" required>

            <button type="submit">Cadastrar Usuário</button>

        </form>

    </main>

</body>

</html>
