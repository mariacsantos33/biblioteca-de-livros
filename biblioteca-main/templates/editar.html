<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Livros</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h2>Editar Livro</h2>

    <a href="{{ url_for('index') }}" class="botao-voltar">Voltar</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}


    <form action="{{ url_for('editar', id=livro[0]) }}" method="post">

        <label for="titulo">Título</label>
        <input type="text" id="titulo"  name="titulo" value="{{ livro[1] }}" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" name="autor" value="{{ livro[2] }}" required>

        <label for="data_publicacao">Data publicação</label>
        <input type="number" id="data_publicacao" name="data_publicacao" value="{{ livro[3] }}" required>

        <button type="submit">Concluído</button>

    </form>

</body>
</html>
